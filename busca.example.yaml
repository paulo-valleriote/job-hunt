# Modelo dos critérios de busca. NÃO preencha este arquivo:
#   cp busca.example.yaml busca.yaml   (o busca.yaml é ignorado pelo git)
# Troque todo valor "EXEMPLO ..." pelo seu. Campo vazio ou de exemplo
# faz /busca e /triagem recusarem rodar (scripts/validar_config.py).
# Formato aceito: "chave: valor" ou "chave:" seguido de itens "  - valor".

# Quem usa cada campo:
#   - cargos_alvo, regime e paises_fuso montam as URLs de busca do /busca (cargo x país).
#   - titulos_excluidos (opcional) descarta a vaga pelo título, antes da verificação.
#   - senioridade, stack_desejada e deal_breakers NÃO filtram a busca: o /busca não os lê.
#     Quem os lê é o /triagem, como contexto para a nota e para avisar de deal breaker.

# Cargos que você procura (um por linha). Cada cargo gera uma URL por país: mais cargos
# diluem os 25 candidatos por rodada. Evite cargos que se repetem.
cargos_alvo:
  - EXEMPLO Engenheiro de Software Backend

# Nível: junior, pleno, senior, etc. É texto livre lido só pelo /triagem; diga também como
# tratar o nível acima do seu (ex.: "aceito mid-senior só com match alto; senior recebe nota baixa").
senioridade: EXEMPLO pleno

# Termos de nível que descartam a vaga pelo título (opcional; ausente ou vazio = não filtra).
# Casa palavra inteira, sem diferença de caixa ou acento: "Lead" pega "Tech Lead", não "Leadership".
# O /busca tira esses cargos antes de abrir a página de cada vaga e, no fim, lista em
# "Descartadas" o que passou. Deixe "Senior" de fora para ainda ver essas vagas e decidir
# (quem trata o nível é o /triagem, pela senioridade acima).
titulos_excluidos:
  - Staff
  - Principal
  - Lead
  - Head
  - Director

# Regime: remoto, híbrido ou presencial.
regime: EXEMPLO remoto

# Países e/ou fusos horários aceitos.
paises_fuso:
  - EXEMPLO Brasil

# Salário mínimo mensal (número) e a moeda no comentário, se quiser.
faixa_salarial_minima: EXEMPLO 0

# Tecnologias desejadas (só o /triagem usa). Liste o que o seu perfil sustenta: stack sem
# experiência real gera vaga com muita lacuna e nota baixa.
stack_desejada:
  - EXEMPLO Python

# O /triagem marca com destaque a vaga que bater com qualquer item (a busca não descarta
# por aqui). Serve para modalidade, tipo de cargo (ex.: Staff, Lead) e anos exigidos (ex.: 8+ years).
deal_breakers:
  - EXEMPLO plantão 24h

# Idiomas de vaga que você aceita (pt-BR, en...).
idiomas_aceitos:
  - EXEMPLO en
